ddns-update-style interim;
ddns-updates on;
ddns-domainname "jmonsan.asir.";
ignore client-updates;

# Key for DDNS updates (replace with actual secret)
key "ddns-key" {
    algorithm hmac-md5;
    secret "your-base64-secret-key";
}

zone jmonsan.asir. {
    primary 127.0.0.1;  # IP address of your DNS server
    key ddns-key;
}

zone 0.168.192.in-addr.arpa. {
    primary 127.0.0.1;  # Reverse DNS zone for IP subnet (example)
    key ddns-key;
}

subnet 192.168.0.0 netmask 255.255.255.0 {
    range 192.168.0.10 192.168.0.100;
    option domain-name "jmonsan.asir";
    option domain-name-servers 192.168.0.1;
    authoritative;
}
